<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Sohati+</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
      .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .auth-card {
        max-width: 500px;
        width: 100%;
      }
      .tabs {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      .tab-btn {
        flex: 1;
        padding: 12px;
        border: 2px solid var(--border);
        background: transparent;
        cursor: pointer;
        border-radius: var(--radius);
        font-weight: 600;
        transition: all 0.3s;
      }
      .tab-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="card auth-card">
        <h1
          style="text-align: center; color: var(--primary); margin-bottom: 24px"
        >
          Create Account
        </h1>

        <div class="tabs">
          <button type="button" class="tab-btn active" data-role="patient">
            Patient
          </button>
          <button type="button" class="tab-btn" data-role="doctor">
            Doctor
          </button>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="username" placeholder="username" required />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              id="email"
              placeholder="your@email.com"
              required
            />
          </div>

          <div class="form-group">
            <label>Password (min 6 chars)</label>
            <input
              type="password"
              id="password"
              placeholder="Enter password"
              required
            />
          </div>

          <div class="form-group">
            <label>Gender</label>
            <select id="gender">
              <option value="other">Prefer not to say</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div id="doctorFields" style="display: none">
            <div class="form-group">
              <label>Specialty</label>
              <select id="specialty_id">
                <option value="">Select...</option>
              </select>
            </div>

            <div class="form-group">
              <label>Years Experience</label>
              <input type="number" id="years_of_experience" min="0" value="5" />
            </div>

            <div class="form-group">
              <label>Consultation Fee ($)</label>
              <input
                type="number"
                id="consultation_fee"
                min="0"
                step="0.01"
                value="50"
              />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            Create Account
          </button>
        </form>

        <p style="text-align: center; margin-top: 24px">
          Have an account?
          <a href="login.html" style="color: var(--primary)">Sign in</a>
        </p>

        <div
          id="errorMsg"
          style="color: var(--danger); text-align: center; margin-top: 16px"
        ></div>
      </div>
    </div>

    <div id="toast"></div>
    <script src="../assets/js/api.js"></script>
    <script>
      let currentRole = "patient";

      // Tab switching
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          currentRole = btn.dataset.role;

          // Update active tab
          document
            .querySelectorAll(".tab-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          // Show/hide doctor fields
          const doctorFields = document.getElementById("doctorFields");
          const specialtyField = document.getElementById("specialty_id");

          if (currentRole === "doctor") {
            doctorFields.style.display = "block";
            specialtyField.setAttribute("required", "required");

            // Load specialties
            try {
              const result = await API.get("specialties.php");
              specialtyField.innerHTML =
                '<option value="">Select...</option>' +
                result.data
                  .map(
                    (s) =>
                      `<option value="${s.id}">${s.specialty_name}</option>`
                  )
                  .join("");
            } catch (error) {
              console.error("Failed to load specialties");
            }
          } else {
            doctorFields.style.display = "none";
            specialtyField.removeAttribute("required");
          }
        });
      });

      // Check URL for role parameter
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("role") === "doctor") {
        document.querySelector('[data-role="doctor"]').click();
      }

      // Form submission
      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const submitBtn = e.target.querySelector('button[type="submit"]');
          const errorMsg = document.getElementById("errorMsg");

          errorMsg.textContent = "";
          submitBtn.disabled = true;
          submitBtn.textContent = "Creating account...";

          const payload = {
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            gender: document.getElementById("gender").value,
            role: currentRole,
          };

          // Add doctor-specific fields
          if (currentRole === "doctor") {
            const specialtyId = document.getElementById("specialty_id").value;

            if (!specialtyId) {
              errorMsg.textContent = "Please select a specialty";
              submitBtn.disabled = false;
              submitBtn.textContent = "Create Account";
              return;
            }

            payload.specialty_id = specialtyId;
            payload.years_of_experience = document.getElementById(
              "years_of_experience"
            ).value;
            payload.consultation_fee =
              document.getElementById("consultation_fee").value;
          }

          try {
            await API.post("register.php", payload);

            showToast("Account created successfully!", "success");

            setTimeout(() => {
              window.location.href = "login.html";
            }, 1500);
          } catch (error) {
            errorMsg.textContent = error.message || "Registration failed";
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Account";
          }
        });
    </script>
  </body>
</html>
