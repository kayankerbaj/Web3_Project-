<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Dashboard - Sohati+</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="layout-app">
    <header class="header">
      <div class="container header-inner">
        <a href="index.html" class="brand">Sohati+</a>
        <nav class="nav">
          <span id="userName" style="color: var(--text-muted);"></span>
          <a href="#" onclick="logout()" style="color: var(--danger);">Logout</a>
        </nav>
      </div>
    </header>

    <aside class="sidebar">
      <div class="sidebar-menu">
        <a href="#" class="active" onclick="showPage('doctors')"> Find Doctors</a>
        <a href="#" onclick="showPage('appointments')"> My Appointments</a>
        <a href="#" onclick="showPage('blood')"> Blood Donation</a>
        <a href="#" onclick="showPage('messages')"> Messages</a>
      </div>
    </aside>

    <main class="main-content">
      <div id="page-doctors" class="page">
        <h1>Find a Doctor</h1>
        
        <div style="display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;">
          <input type="text" id="searchDoctors" placeholder="Search doctors..." 
                 style="flex: 1; min-width: 200px; padding: 12px; border: 2px solid var(--border); border-radius: var(--radius);">
          <select id="filterSpecialty" style="padding: 12px; border: 2px solid var(--border); border-radius: var(--radius);">
            <option value="">All Specialties</option>
          </select>
        </div>
        
        <div id="doctorsList" class="grid grid-3"></div>
      </div>

      <div id="page-appointments" class="page" style="display: none;">
        <h1>My Appointments</h1>
        <div id="appointmentsList" class="grid grid-2"></div>
      </div>

      <div id="page-blood" class="page" style="display: none;">
        <h1>Blood Donation</h1>
        
        <div class="grid grid-2" style="margin-bottom: 40px;">
          <div class="card">
            <h3 style="margin-bottom: 16px;">Update Your Blood Type</h3>
            <div class="form-group">
              <label>Select Blood Type</label>
              <select id="bloodTypeSelect">
                <option value="">Select...</option>
              </select>
            </div>
            <button onclick="updateBloodType()" class="btn btn-primary">Update Blood Type</button>
          </div>
          
          <div class="card">
            <h3 style="margin-bottom: 16px;">Request Blood</h3>
            <div class="form-group">
              <label>Blood Type Needed</label>
              <select id="neededBloodType">
                <option value="">Select...</option>
              </select>
            </div>
            <div class="form-group">
              <label>Urgency</label>
              <select id="urgency">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
              </select>
            </div>
            <button onclick="requestBlood()" class="btn btn-secondary">Request Blood</button>
          </div>
        </div>
        
        <h2 style="margin-bottom: 20px;">Current Blood Requests</h2>
        <div id="bloodRequestsList" class="grid grid-3"></div>
      </div>

      <div id="page-messages" class="page" style="display: none;">
        <h1>Messages</h1>
        <div id="conversationsList" class="grid grid-2"></div>
      </div>
    </main>
  </div>

  <div id="bookModal" class="modal">
    <div class="modal-content">
      <h2 style="margin-bottom: 24px;">Book Appointment</h2>
      <p id="doctorName" style="color: var(--text-muted); margin-bottom: 24px;"></p>
      
      <form id="bookForm">
        <div class="form-group">
          <label>Appointment Date</label>
          <input type="date" id="bookDate" required>
        </div>
        
        <div class="form-group">
          <label>Appointment Time</label>
          <input type="time" id="bookTime" required>
        </div>
        
        <div class="form-group">
          <label>Reason for Visit (Optional)</label>
          <textarea id="bookNotes" rows="3" placeholder="Describe your symptoms"></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Confirm Booking</button>
        <button type="button" class="btn btn-outline btn-block" onclick="closeModal('bookModal')" 
                style="margin-top: 8px;">Cancel</button>
      </form>
    </div>
  </div>

  <div id="chatModal" class="modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="margin: 0;" id="chatWith"></h2>
        <button onclick="closeModal('chatModal')" style="background: none; border: none; font-size: 24px; cursor: pointer;">×</button>
      </div>
      
      <div id="chatMessages" style="max-height: 400px; overflow-y: auto; margin-bottom: 16px; padding: 16px; background: var(--bg); border-radius: var(--radius);"></div>
      
      <form id="chatForm" style="display: flex; gap: 8px;">
        <input type="text" id="chatInput" placeholder="Type a message..." required 
               style="flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: var(--radius);">
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script src="../assets/js/api.js"></script>
  <script>
    let allDoctors = [];
    let currentDoctorId = null;
    let currentChatUserId = null;
    let chatInterval = null;

    window.addEventListener('load', async () => {
      const user = await checkAuth();
      if (user) {
        document.getElementById('userName').textContent = `Hi, ${user.username}`;
        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('bookDate').setAttribute('min', today);
        
        loadDoctors();
        loadSpecialties();
        loadAppointments();
        loadConversations();
        loadBloodTypes();
        loadBloodRequests();
      }
    });

    async function loadDoctors() {
      showLoading('doctorsList');
      
      try {
        const result = await API.get('doctors.php');
        allDoctors = result.data;
        renderDoctors(allDoctors);
      } catch (error) {
        document.getElementById('doctorsList').innerHTML = 
          '<p class="empty-state">Failed to load doctors</p>';
      }
    }

    function renderDoctors(doctors) {
      const list = document.getElementById('doctorsList');
      
      if (doctors.length === 0) {
        list.innerHTML = '<p class="empty-state"><div class="empty-state-icon">⚕️</div>No doctors found</p>';
        return;
      }
      
      list.innerHTML = doctors.map(doc => `
        <div class="card">
          <div style="font-size: 64px; text-align: center; margin-bottom: 12px;">⚕️</div>
          <h3 style="text-align: center; margin-bottom: 8px;">Dr. ${doc.username}</h3>
          <p style="text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 8px;">
            ${doc.specialty_name || 'General Practice'}
          </p>
          <p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 8px;">
            ${doc.years_of_experience} years experience
          </p>
          <p style="text-align: center; font-weight: 600; color: var(--primary); margin-bottom: 16px;">
            $${doc.consultation_fee}/session
          </p>
          <div style="display: flex; gap: 8px;">
            <button onclick="bookDoctor(${doc.id}, '${doc.username}')" class="btn btn-primary btn-block btn-small">
              Book Appointment
            </button>
            <button onclick="startChat(${doc.user_id}, 'Dr. ${doc.username}')" class="btn btn-secondary btn-small" style="flex: 0 0 auto;">
              Message
            </button>
          </div>
        </div>
      `).join('');
    }

    async function loadSpecialties() {
      try {
        const result = await API.get('specialties.php');
        const select = document.getElementById('filterSpecialty');
        
        result.data.forEach(specialty => {
          const option = document.createElement('option');
          option.value = specialty.id;
          option.textContent = specialty.specialty_name;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('Failed to load specialties');
      }
    }

    document.getElementById('searchDoctors').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allDoctors.filter(doc => 
        doc.username.toLowerCase().includes(query) ||
        (doc.specialty_name && doc.specialty_name.toLowerCase().includes(query))
      );
      renderDoctors(filtered);
    });

    document.getElementById('filterSpecialty').addEventListener('change', (e) => {
      const specialtyId = e.target.value;
      
      if (specialtyId) {
        const filtered = allDoctors.filter(doc => doc.specialty_id == specialtyId);
        renderDoctors(filtered);
      } else {
        renderDoctors(allDoctors);
      }
    });

    function bookDoctor(doctorId, doctorName) {
      currentDoctorId = doctorId;
      document.getElementById('doctorName').textContent = `Booking with Dr. ${doctorName}`;
      openModal('bookModal');
    }

    function startChat(userId, userName) {
      openChat(userId, userName);
    }

    document.getElementById('bookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const data = {
        doctor_id: currentDoctorId,
        date: document.getElementById('bookDate').value,
        time: document.getElementById('bookTime').value,
        notes: document.getElementById('bookNotes').value
      };
      
      try {
        await API.post('book.php', data);
        showToast('Appointment booked successfully!', 'success');
        closeModal('bookModal');
        
        document.getElementById('bookForm').reset();
        
        loadAppointments();
        showPage('appointments');
      } catch (error) {
        // Error already shown
      }
    });

    async function loadAppointments() {
      showLoading('appointmentsList');
      
      try {
        const result = await API.get('appointments.php');
        const list = document.getElementById('appointmentsList');
        
        if (result.data.length === 0) {
          list.innerHTML = '<p class="empty-state"><div class="empty-state-icon">���</div>No appointments yet</p>';
          return;
        }
        
        list.innerHTML = result.data.map(apt => `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
              <div>
                <h3 style="margin-bottom: 4px;">Dr. ${apt.doctor_name}</h3>
                <p style="color: var(--text-muted); font-size: 14px;">${apt.specialty_name || 'General Practice'}</p>
              </div>
              <span class="badge" style="background: ${apt.status_color}20; color: ${apt.status_color};">
                ${apt.status_name}
              </span>
            </div>
            <p style="margin-bottom: 8px;">
               ${formatDate(apt.appointment_date)} at ${formatTime(apt.appointment_time)}
            </p>
            ${apt.notes ? `<p style="color: var(--text-muted); font-size: 14px; margin-bottom: 12px;">${apt.notes}</p>` : ''}
            <div style="display: flex; gap: 8px;">
              ${apt.status_name === 'Pending' || apt.status_name === 'Confirmed' ? `
                <button onclick="cancelAppointment(${apt.id})" class="btn btn-danger btn-small">Cancel</button>
              ` : ''}
            </div>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('appointmentsList').innerHTML = 
          '<p class="empty-state">Failed to load appointments</p>';
      }
    }

    async function cancelAppointment(id) {
      if (!confirm('Are you sure you want to cancel this appointment?')) return;
      
      try {
        await API.post('cancel-appointment.php', { appointment_id: id });
        showToast('Appointment cancelled', 'success');
        loadAppointments();
      } catch (error) {
        // Error already shown
      }
    }

    async function loadBloodTypes() {
      try {
        const result = await API.get('blood-types.php');
        
        const selects = ['bloodTypeSelect', 'neededBloodType'];
        selects.forEach(selectId => {
          const select = document.getElementById(selectId);
          select.innerHTML = '<option value="">Select...</option>' +
            result.data.map(bt => `<option value="${bt.id}">${bt.blood_type}</option>`).join('');
        });
      } catch (error) {
        console.error('Failed to load blood types');
      }
    }

    async function updateBloodType() {
      const bloodTypeId = document.getElementById('bloodTypeSelect').value;
      
      if (!bloodTypeId) {
        showToast('Please select a blood type', 'error');
        return;
      }
      
      try {
        await API.post('update-blood-type.php', { blood_type_id: parseInt(bloodTypeId) });
        showToast('Blood type updated successfully', 'success');
      } catch (error) {
        // Error already shown
      }
    }

    async function requestBlood() {
      const neededBloodTypeId = document.getElementById('neededBloodType').value;
      const urgency = document.getElementById('urgency').value;
      
      if (!neededBloodTypeId) {
        showToast('Please select blood type needed', 'error');
        return;
      }
      
      try {
        await API.post('create-blood-request.php', {
          needed_blood_type_id: parseInt(neededBloodTypeId),
          urgency: urgency
        });
        showToast('Blood request created successfully', 'success');
        loadBloodRequests();
      } catch (error) {
        // Error already shown
      }
    }

    async function loadBloodRequests() {
      showLoading('bloodRequestsList');
      
      try {
        const result = await API.get('blood-requests.php');
        const list = document.getElementById('bloodRequestsList');
        
        if (result.data.length === 0) {
          list.innerHTML = '<p class="empty-state">No blood requests at this time</p>';
          return;
        }
        
        list.innerHTML = result.data.map(req => `
          <div class="card" style="text-align: center;">
            <div style="font-size: 48px; margin-bottom: 12px;">${req.blood_type}</div>
            <h3 style="color: var(--danger); margin-bottom: 8px;">${req.blood_type}</h3>
            <p style="color: var(--text-muted); font-size: 14px;">
              ${req.request_count} request(s)
            </p>
            <p style="color: var(--text-muted); font-size: 13px;">
              ${req.total_quantity}ml needed
            </p>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('bloodRequestsList').innerHTML = 
          '<p class="empty-state">Failed to load requests</p>';
      }
    }

    async function loadConversations() {
      showLoading('conversationsList');
      
      try {
        const result = await API.get('conversations.php');
        const list = document.getElementById('conversationsList');
        
        if (result.data.length === 0) {
          list.innerHTML = '<p class="empty-state"><div class="empty-state-icon"></div>No conversations yet. Start chatting with a doctor from the "Find Doctors" page!</p>';
          return;
        }
        
        list.innerHTML = result.data.map(conv => `
          <div class="card" onclick="openChat(${conv.other_user_id}, '${conv.username}')" style="cursor: pointer;">
            <div style="display: flex; justify-content: space-between; align-items: start;">
              <div>
                <h3 style="margin-bottom: 4px;">${conv.username}</h3>
                <p style="color: var(--text-muted); font-size: 13px; text-transform: capitalize;">${conv.role}</p>
              </div>
              ${conv.unread_count > 0 ? `
                <span class="badge badge-primary">${conv.unread_count}</span>
              ` : ''}
            </div>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
              ${conv.last_message || 'No messages yet'}
            </p>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('conversationsList').innerHTML = 
          '<p class="empty-state">Failed to load conversations</p>';
      }
    }

    function openChat(userId, userName) {
      currentChatUserId = userId;
      document.getElementById('chatWith').textContent = userName;
      openModal('chatModal');
      loadMessages();
      
      if (chatInterval) clearInterval(chatInterval);
      chatInterval = setInterval(loadMessages, 3000);
    }

    async function loadMessages() {
      try {
        const result = await API.get(`messages.php?user_id=${currentChatUserId}`);
        const container = document.getElementById('chatMessages');
        
        if (result.data.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No messages yet. Say hi! </p>';
          return;
        }
        
        container.innerHTML = result.data.map(msg => `
          <div style="margin-bottom: 12px; text-align: ${msg.sender_id == currentChatUserId ? 'left' : 'right'};">
            <div style="display: inline-block; max-width: 70%; padding: 8px 12px; border-radius: var(--radius); 
                        background: ${msg.sender_id == currentChatUserId ? 'var(--bg)' : 'var(--primary)'}; 
                        color: ${msg.sender_id == currentChatUserId ? 'var(--text)' : 'white'};">
              ${msg.message_text}
            </div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
              ${new Date(msg.created_at).toLocaleTimeString()}
            </div>
          </div>
        `).join('');
        
        container.scrollTop = container.scrollHeight;
      } catch (error) {
        console.error('Failed to load messages');
      }
    }

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      
      if (!message) return;
      
      try {
        await API.post('send-message.php', {
          receiver_id: currentChatUserId,
          message: message
        });
        
        input.value = '';
        loadMessages();
        loadConversations();
      } catch (error) {
        // Error already shown
      }
    });

    document.getElementById('chatModal').addEventListener('click', (e) => {
      if (e.target.id === 'chatModal') {
        if (chatInterval) {
          clearInterval(chatInterval);
          chatInterval = null;
        }
      }
    });
  </script>
</body>
</html>
